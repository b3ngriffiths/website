name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
      # sha256 of hugo_extended_${HUGO_VERSION}_linux-amd64.deb from the release checksums file
      HUGO_SHA256: a20f7da84e0981bebbecc032cc87f0dda2049a844727720aab14e61ce416e5e9
    steps:
      - name: 📦 Install Hugo CLI
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          asset="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL -o "${asset}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${asset}"
          echo "${HUGO_SHA256}  ${asset}" | sha256sum -c -
          sudo dpkg -i "${asset}"

      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: ⚙️ Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 🔨 Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          set -euo pipefail
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

          if [ ! -f "./public/index.html" ]; then
            echo "❌ Error: Build did not produce index.html"
            exit 1
          fi

          echo "✅ Build completed successfully"

          echo "### 🎉 Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Hugo version:** ${HUGO_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Files generated:** $(find ./public -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Total size:** $(du -sh ./public | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment URL:** ${{ steps.pages.outputs.base_url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

      - name: ✅ Build Status
        run: |
          echo "🌍 Site ready for deployment to: ${{ steps.pages.outputs.base_url }}"

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
